# Khởi tạo khối cấu hình máy chủ ảo Nginx
server {
    # Nginx lắng nghe các kết nối HTTP gửi tới cổng 80 bên trong container
    listen 80;
    # Thiết lập tên miền tiếp nhận là localhost
    server_name localhost;

    # Nâng giới hạn dung lượng tải lên 50MB khớp với giới hạn của Backend
    client_max_body_size 50M;

    # KHỐI 1: Phục vụ ứng dụng React Single Page Application
    location / {
        # Đường dẫn thư mục chứa các file tĩnh đã build từ Vite
        root /usr/share/nginx/html;
        # Khai báo file khởi chạy mặc định
        index index.html index.htm;
        # Kiểm tra file thật, thư mục thật, nếu không có thì trả về index.html để React Router xử lý
        try_files $uri $uri/ /index.html;
    }

    # KHỐI 2: Đóng vai trò Reverse Proxy chuyển tiếp các request API
    location /api/ {
        # Đẩy gói tin sang container backend qua cổng 8000 nội bộ và giữ nguyên /api/
        proxy_pass http://backend:8000;
        # Giữ nguyên giá trị header Host ban đầu của máy khách
        proxy_set_header Host $host;
        # Đính kèm IP thực tế của máy khách vào header để gửi sang Backend
        proxy_set_header X-Real-IP $remote_addr;
        # Đính kèm danh sách IP của các proxy trung gian
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Đính kèm giao thức kết nối gốc (http hoặc https)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # KHỐI 3: Đóng vai trò Reverse Proxy phục vụ các file media kết quả lưu trong thư mục static
    location /static/ {
        # Đẩy yêu cầu lấy file kết quả sang thư mục static của Backend
        proxy_pass http://backend:8000;
        # Chuyển tiếp thông tin Host gốc
        proxy_set_header Host $host;
        # Chuyển tiếp địa chỉ IP thật của máy khách
        proxy_set_header X-Real-IP $remote_addr;
    }
}
