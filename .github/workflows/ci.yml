name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r backend/requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Dừng build nếu có lỗi cú pháp hoặc biến chưa định nghĩa
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Cảnh báo các vi phạm chuẩn code PEP8 (độ dài dòng < 127 ký tự)
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest test_main.py -v

  frontend-ci:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validate Production Build
        working-directory: ./frontend
        run: npm run build

  docker-dry-run:
    name: Test Docker Builds
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build Frontend Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
