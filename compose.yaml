services:
  backend:
    build: ./backend
    container_name: yolo-backend-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Giữ lại file ảnh/video tạm ngoài máy host (Requirement 7)
      - ./backend/static:/app/static
    healthcheck:
      # Kiểm tra định kỳ xem Uvicorn & YOLO đã nạp xong chưa (Requirement 4)
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - yolo-net

  frontend:
    build: ./frontend
    container_name: yolo-frontend-app
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      # Frontend chỉ được bật khi Backend đã thực sự khỏe mạnh (healthy)
      backend:
        condition: service_healthy
    networks:
      - yolo-net

networks:
  yolo-net:
    driver: bridge
